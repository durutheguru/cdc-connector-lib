  processor-config:
    batch: false
    concurrent: true
    threadPoolSize: 10
    engine: EMBED
    sync: REDIS
    max-retries: 3
    retry-topic-suffix: -retry
    dl-topic-suffix: -dlt


logging:
  level:
    root: INFO


queue:
  config:
    background-activity:
      enabled: false

    consumers:
      default-group-id: group-id

    topics:
      partitions: 5
      replication: 1

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:33080/employee?createDatabaseIfNotExist=true&serverTimezone=UTC%2B1}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234567890}
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialization-mode: always

  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      auto-offset-reset: earliest
    producer:
      properties:
        request.timeout.ms: 2000


  jpa:
    hibernate.ddl-auto: none
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect

  data.redis:
    host: localhost
    port: 6379
    password: password

  sql:
    init:
      mode: always

